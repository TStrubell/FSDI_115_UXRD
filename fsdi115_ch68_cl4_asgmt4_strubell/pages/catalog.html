<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SGnG – Catalog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-catalog">
  <header class="site-header">
    <div class="logo-area">
      <img src="images/logo-sgng.png" alt="Strubell Goods & Gear logo" class="logo">
      <span class="brand-name">SGnG</span>
    </div>
    <nav class="main-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="catalog.html" class="nav-link active">Catalog</a>
      <a href="cart.html" class="nav-link">Cart</a>
    </nav>
  </header>

  <main>
    <section class="catalog-header">
      <h1>Wallets</h1>
      <p class="item-count">24 items found</p>
      <div class="filter-bar">
        <label>
          Category
          <select>
            <option>All</option>
            <option>Wallets</option>
            <option>Bags</option>
            <option>Accessories</option>
          </select>
        </label>
        <label>
          Sort By
          <select>
            <option>Featured</option>
            <option>Price: Low to High</option>
            <option>Price: High to Low</option>
          </select>
        </label>
        <label>
          Price Range
          <select>
            <option>All</option>
            <option>Under $50</option>
            <option>$50–$100</option>
          </select>
        </label>
      </div>
    </section>

    <section class="catalog-grid">
      <article class="product-card">
        <img src="images/catalog-wallet-1.jpg" alt="Classic Bifold Wallet">
        <h3>Classic Bifold Wallet</h3>
        <p class="price">$49.99</p>
        <a href="product.html" class="btn btn-outline">View</a>
      </article>
      <article class="product-card">
        <img src="images/catalog-wallet-2.jpg" alt="Heritage Slim Bifold">
        <h3>Heritage Slim Bifold</h3>
        <p class="price">$79.99</p>
        <a href="product.html" class="btn btn-outline">View</a>
      </article>
      <!-- Add more product cards as needed -->
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">About</a>
      <a href="#">Returns</a>
      <a href="#">Contact</a>
    </div>
    <p>&copy; 2026 Strubell Goods &amp; Gear. All rights reserved.</p>
  </footer>
</body>
</html>
